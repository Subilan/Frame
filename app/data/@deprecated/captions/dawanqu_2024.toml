["2024.08.16_19.10.47.jpg"]
content = '''
当时正在建的小梅沙地铁站旁，不知从何处来的流浪猫。
'''

["2024.08.16_14.51.01.jpg"]
title = '桔钓沙'
content = '''
我第一次见到玻璃海的地方，虽然不是非常透明，但能看到在里面游动的小鱼（未拍到）。
'''

["2024.08.16_15.51.09.jpg"]
title = '南澳月亮湾'
content = '''
从月亮湾望向海的某个方向。一年之后，我会来到这一视线远端的香港中文大学。
'''

["2024.08.21_15.07.57.jpg"]
content = '''
梧桐山里开的一家咖啡馆，一种不认识的庞大植物，探出了为它留空的天花板。
'''

["2024.08.09_16.03.57.jpg"]
content = '大梅沙的海边栈道，阳光照耀下碧绿色的海水上，浮着一团神秘物质。'

["2024.08.09_15.24.57.jpg"]
title = '大梅沙'
content = '没有那么多人的大梅沙也可以很惬意，只是太阳稍微大了点。在这个角度看海水略微有种漂亮的绿色。'

["2024.08.11_19.23.16.jpg"]
title = '梧桐山，凌云道'
content = '''
在没有搜任何攻略的情况下，我随意选择了从凌云道上下小梧桐
事实证明，凌云道既陡又险，在这里尤能体会到下山难。
'''

["2024.08.12_19.36.31.jpg"]
title = '发生什么事了'
content = '''
在前往永庆坊途中，我见到好几个就地摆放的贡品和香，很好奇发生了什么事情。
后来想想，可能是因为中元节就在六天后。
'''

["2024.08.19_15.25.31.jpg"]
title = '老翁龙舌兰（Agave schidigera）'
content = '温室里发现的非常有趣的一颗植物。牌子上标的“泷之白丝”是从日文译过来的，它是一种多肉植物，也是一种龙舌兰。'

["2024.08.19_15.32.22.jpg"]
title = '佛珠吊兰（Senecio rowleyanus）'
content = '''
日语里叫绿铃（緑の鈴，ミドリノスズ）。植物园里的这颗长得有些敷衍。
去网上搜索可以发现长得好的颗颗饱满像豌豆。有点想养了！
'''

["2024.08.19_12.41.39.jpg"]
title = '苏铁（Cycas revoluta）'
content = '这算是一张怼着铁树的脸拍的照片么？'